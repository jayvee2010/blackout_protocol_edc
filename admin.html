<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDC / IEEE Admin Console - 3 Eras & Leaderboard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Default configuration rules
    const DEFAULT_SETTINGS = {
      mg1_name: "Code Sprint",
      mg1_max: 50,
      mg2_name: "Debugging Battle",
      mg2_max: 50,
      mg3_name: "UI/UX Quiz",
      mg3_max: 50,
      extratime_cost: 100,
      hint_cost: 50,
      extratime_bonus: 60,
      // 3 Eras settings (durations in seconds)
      era1_name: "Era 1 - Ancient / Retro",
      era1_limit: 600, // 10 mins
      era2_name: "Era 2 - Industrial / Modern",
      era2_limit: 600, // 10 mins
      era3_name: "Era 3 - Cyber / Future",
      era3_limit: 600, // 10 mins
      overall_limit: 1800, // 30 mins
      timeout_penalty: 10 // Default penalty when time runs out
    };

    // Live-leaderboard server
    const SERVER = (location.protocol.startsWith('http') && location.origin && location.origin !== 'null')
      ? location.origin
      : 'http://localhost:3000';

    let setServerConnectedGlobal = null;
    const pushLive = (groups, sessions, settings) =>
      fetch(SERVER + '/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ groups, sessions, settings })
      })
      .then(r => { if (r.ok && setServerConnectedGlobal) setServerConnectedGlobal(true); return r; })
      .catch(() => { if (setServerConnectedGlobal) setServerConnectedGlobal(false); });

    // Format seconds as MM:SS
    const formatTime = (s) => {
      const sec = Math.max(0, Math.floor(Number(s) || 0));
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const rem = (sec % 60).toString().padStart(2, '0');
      return `${m}:${rem}`;
    };

    // React-owned inline SVG icons
    const Icon = ({ size = 16, className = "", children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
           stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
           className={`shrink-0 ${className}`} aria-hidden="true">
        {children}
      </svg>
    );

    const LayoutDashboardIcon = () => (
      <Icon><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Icon>
    );
    const Gamepad2Icon = () => (
      <Icon><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></Icon>
    );
    const TrophyIcon = ({ className = "" }) => (
      <Icon className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></Icon>
    );
    const SettingsIcon = () => (
      <Icon><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>
    );
    const UsersIcon = () => (
      <Icon><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>
    );
    const PlusIcon = () => <Icon size={14}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
    const Trash2Icon = () => (
      <Icon><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>
    );
    const Edit3Icon = () => <Icon><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></Icon>;
    const PlayIcon = () => <Icon size={18}><polygon points="6 3 20 12 6 21 6 3"/></Icon>;
    const PauseIcon = () => <Icon size={18}><rect width="4" height="16" x="6" y="4"/><rect width="4" height="16" x="14" y="4"/></Icon>;
    const SquareIcon = () => <Icon size={18}><rect width="18" height="18" x="3" y="3" rx="2"/></Icon>;
    const FlagIcon = () => <Icon size={18}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></Icon>;
    const CheckCircle2Icon = () => <Icon size={18}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>;
    const AlertCircleIcon = () => <Icon size={18}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></Icon>;
    const SearchIcon = () => <Icon><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>;
    const AwardIcon = () => <Icon size={18}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></Icon>;
    const MinusCircleIcon = () => <Icon size={16}><circle cx="12" cy="12" r="10"/><line x1="8" x2="16" y1="12" y2="12"/></Icon>;
    const ExternalLinkIcon = () => <Icon size={14}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></Icon>;
    const RotateCcwIcon = () => <Icon size={16}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Icon>;

    // Calculation helper for a team session
    function computeTeamResults(g, session, settings) {
      const ss = session || {};
      const earned = (Number(ss.score1) || 0) + (Number(ss.score2) || 0) + (Number(ss.score3) || 0);
      const cost = ss.reward_cost_snapshot !== undefined ? Number(ss.reward_cost_snapshot)
        : (ss.reward_type === 'Extra Time' ? Number(settings.extratime_cost) : ss.reward_type === 'Hint' ? Number(settings.hint_cost) : 0);
      
      const deductions = Array.isArray(ss.deductions) ? ss.deductions : [];
      const totalDeductions = deductions.reduce((sum, d) => sum + (Number(d.amount) || 0), 0);
      
      const netPoints = Math.max(0, earned - cost - totalDeductions);
      
      const era1Time = Number(ss.era1_duration) || 0;
      const era2Time = Number(ss.era2_duration) || 0;
      const era3Time = Number(ss.era3_duration) || 0;
      const actualDuration = Number(ss.actual_duration) || (era1Time + era2Time + era3Time);
      
      const bonus = ss.reward_type === 'Extra Time' ? Number(settings.extratime_bonus) || 0 : 0;
      const adjustedDuration = Math.max(0, actualDuration - bonus);

      return {
        earned,
        cost,
        deductions,
        totalDeductions,
        netPoints,
        era1Time,
        era2Time,
        era3Time,
        actualDuration,
        bonus,
        adjustedDuration,
        rewardType: ss.reward_type || 'None'
      };
    }

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [groups, setGroups] = useState([]);
      const [sessions, setSessions] = useState({});
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [activeGameId, setActiveGameId] = useState(null);
      const [toast, setToast] = useState(null);
      const [serverConnected, setServerConnected] = useState(false);
      setServerConnectedGlobal = setServerConnected;

      // Deduction modal state
      const [showDeductModal, setShowDeductModal] = useState(false);
      const [deductTargetId, setDeductTargetId] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Periodic health check
      useEffect(() => {
        const ping = () => {
          fetch(SERVER + '/api/health')
            .then(r => setServerConnected(r.ok))
            .catch(() => setServerConnected(false));
        };
        ping();
        const iv = setInterval(ping, 4000);
        return () => clearInterval(iv);
      }, []);

      // Load persistent state
      useEffect(() => {
        try {
          const localGroups = localStorage.getItem('edc_event_groups');
          const localSess = localStorage.getItem('edc_event_sessions');
          const localSets = localStorage.getItem('edc_event_settings');
          if (localGroups) setGroups(JSON.parse(localGroups));
          if (localSess) setSessions(JSON.parse(localSess));
          if (localSets) setSettings({ ...DEFAULT_SETTINGS, ...JSON.parse(localSets) });

          if (localGroups || localSess) {
            pushLive(
              localGroups ? JSON.parse(localGroups) : [],
              localSess ? JSON.parse(localSess) : {},
              localSets ? { ...DEFAULT_SETTINGS, ...JSON.parse(localSets) } : DEFAULT_SETTINGS
            );
          } else {
            fetch(SERVER + '/api/state').then(r => r.json()).then(d => {
              setServerConnected(true);
              if (d.groups && d.groups.length) {
                setGroups(d.groups);
                setSessions(d.sessions || {});
                if (d.settings) setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
              }
            }).catch(() => setServerConnected(false));
          }
        } catch (err) {
          console.warn("Storage load error:", err);
        }
      }, []);

      const saveToStore = (newGroups, newSessions, newSettings) => {
        if (newGroups !== undefined) {
          setGroups(newGroups);
          localStorage.setItem('edc_event_groups', JSON.stringify(newGroups));
        }
        if (newSessions !== undefined) {
          setSessions(newSessions);
          localStorage.setItem('edc_event_sessions', JSON.stringify(newSessions));
        }
        if (newSettings !== undefined) {
          setSettings(newSettings);
          localStorage.setItem('edc_event_settings', JSON.stringify(newSettings));
        }
        pushLive(
          newGroups !== undefined ? newGroups : groups,
          newSessions !== undefined ? newSessions : sessions,
          newSettings !== undefined ? newSettings : settings
        );
      };

      // Handle point deduction
      const handleAddDeduction = (groupId, amount, reason) => {
        const currentSess = sessions[groupId] || {};
        const oldDeductions = Array.isArray(currentSess.deductions) ? currentSess.deductions : [];
        const newDeduction = {
          id: 'ded_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          amount: Number(amount) || 0,
          reason: reason || 'Manual volunteer penalty',
          timestamp: Date.now()
        };
        const updatedDeductions = [...oldDeductions, newDeduction];
        const updatedSess = {
          ...currentSess,
          deductions: updatedDeductions,
          total_deductions: updatedDeductions.reduce((a, b) => a + b.amount, 0)
        };
        saveToStore(groups, { ...sessions, [groupId]: updatedSess }, settings);
        showToast(`Deducted -${amount} pts: ${reason}`, 'error');
      };

      const handleRemoveDeduction = (groupId, deductionId) => {
        const currentSess = sessions[groupId] || {};
        const oldDeductions = Array.isArray(currentSess.deductions) ? currentSess.deductions : [];
        const updatedDeductions = oldDeductions.filter(d => d.id !== deductionId);
        const updatedSess = {
          ...currentSess,
          deductions: updatedDeductions,
          total_deductions: updatedDeductions.reduce((a, b) => a + b.amount, 0)
        };
        saveToStore(groups, { ...sessions, [groupId]: updatedSess }, settings);
        showToast('Penalty deduction reversed.');
      };

      // Ranked completed groups
      const completedGroups = groups.filter(g => sessions[g.id]?.status === 'Completed').map(g => {
        const res = computeTeamResults(g, sessions[g.id], settings);
        return { ...g, session: sessions[g.id], res };
      });

      // Sort: Lowest adjusted time first, then highest net points
      completedGroups.sort((a, b) => {
        if (a.res.adjustedDuration !== b.res.adjustedDuration) {
          return a.res.adjustedDuration - b.res.adjustedDuration;
        }
        return b.res.netPts - a.res.netPts;
      });

      let currentRank = 1;
      const rankedCompletedGroups = completedGroups.map((group, index, arr) => {
        if (index > 0 && (group.res.adjustedDuration !== arr[index - 1].res.adjustedDuration || group.res.netPts !== arr[index - 1].res.netPts)) {
          currentRank = index + 1;
        }
        return { ...group, officialRank: currentRank };
      });

      const totalMembersCount = groups.reduce((acc, g) => acc + (g.members ? g.members.length : 0), 0);
      const activeTeam = groups.find(g => g.id === activeGameId) || groups[0];

      return (
        <div className="flex h-screen bg-[#F8FAFC] text-[#0F172A] font-sans overflow-hidden antialiased">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border text-sm font-semibold transition-all ${
              toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'
            }`}>
              {toast.type === 'error' ? <AlertCircleIcon /> : <CheckCircle2Icon />}
              <span>{toast.message}</span>
            </div>
          )}

          {/* Point Deduction Modal */}
          {showDeductModal && (
            <DeductionModal
              groups={groups}
              sessions={sessions}
              settings={settings}
              initialGroupId={deductTargetId || activeGameId || (groups[0] && groups[0].id)}
              onClose={() => setShowDeductModal(false)}
              onAddDeduction={handleAddDeduction}
              onRemoveDeduction={handleRemoveDeduction}
            />
          )}

          {/* Sidebar Navigation */}
          <aside className="w-64 bg-white border-r border-slate-200/80 flex flex-col justify-between select-none shadow-sm shrink-0">
            <div>
              <div className="p-6 border-b border-slate-100">
                <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400">IEEE / EDC TECH EVENT</div>
                <div className="text-lg font-black text-slate-900 mt-0.5 tracking-tight">
                  Control Console
                </div>
                <div className="text-[10px] font-bold text-indigo-600 mt-1">3 Eras Stopwatch · Live Standings</div>
              </div>

              <nav className="p-4 space-y-1">
                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <LayoutDashboardIcon />
                  <span>Dashboard</span>
                </button>
                <button onClick={() => { if (!activeGameId && groups.length > 0) setActiveGameId(groups[0].id); setActiveTab('gamezone'); }} className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all ${activeTab === 'gamezone' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <Gamepad2Icon />
                  <span>GameZone (3 Eras)</span>
                </button>
                <button onClick={() => setActiveTab('leaderboard')} className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all ${activeTab === 'leaderboard' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <TrophyIcon />
                  <span>Official Leaderboard</span>
                </button>
                <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all ${activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <SettingsIcon />
                  <span>Era &amp; Rules Settings</span>
                </button>
              </nav>
            </div>

            <div className="p-4 border-t border-slate-100 bg-slate-50/50 flex flex-col gap-2.5">
              <div className="flex flex-col gap-1 text-xs font-medium text-slate-500">
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"/> Local Storage Active</span>
                <span className="flex items-center gap-1.5">
                  <span className={`w-2 h-2 rounded-full ${serverConnected ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}/>
                  {serverConnected ? 'Server Backend Connected' : 'Server Offline (Local Only)'}
                </span>
              </div>

              <a 
                href="/" 
                target="_blank" 
                rel="noreferrer"
                className="w-full py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition-colors flex items-center justify-center gap-2"
              >
                <span>Open Public Standings</span>
                <ExternalLinkIcon />
              </a>

              <button 
                onClick={() => {
                  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ groups, sessions, settings }, null, 2));
                  const downloadAnchor = document.createElement('a');
                  downloadAnchor.setAttribute("href", dataStr);
                  downloadAnchor.setAttribute("download", `edc_event_backup_${Date.now()}.json`);
                  document.body.appendChild(downloadAnchor);
                  downloadAnchor.click();
                  downloadAnchor.remove();
                  showToast("Backup exported successfully!");
                }}
                className="w-full py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition-colors text-center"
              >
                Export JSON Backup
              </button>
            </div>
          </aside>

          {/* Main Area */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            {/* Top Global Bar with Deduct Points Button */}
            <header className="h-16 bg-white border-b border-slate-200/80 px-8 flex items-center justify-between shrink-0 shadow-sm z-20">
              <div className="flex items-center gap-4">
                <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Active View:</span>
                <span className="text-sm font-extrabold text-slate-900 capitalize">
                  {activeTab === 'gamezone' ? 'GameZone - 3 Eras Stopwatch' : activeTab}
                </span>
                {activeTeam && (
                  <span className="hidden md:inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-bold">
                    <span>#{activeTeam.game_id}</span>
                    <span>{activeTeam.group_name}</span>
                  </span>
                )}
              </div>

              {/* Dedicated Top Deduct Points Action Button */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => {
                    setDeductTargetId(activeGameId || (groups[0] && groups[0].id));
                    setShowDeductModal(true);
                  }}
                  disabled={groups.length === 0}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold shadow-sm transition-all ${
                    groups.length === 0
                      ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                      : 'bg-rose-600 hover:bg-rose-700 text-white shadow-rose-200 hover:shadow'
                  }`}
                  title="Manually deduct points from a team at any point"
                >
                  <MinusCircleIcon />
                  <span>Deduct Points</span>
                </button>
              </div>
            </header>

            {/* Content Scroll Area */}
            <main className="flex-1 overflow-y-auto">
              {activeTab === 'dashboard' && (
                <DashboardSection 
                  groups={groups} 
                  totalMembersCount={totalMembersCount}
                  rankedCompletedGroups={rankedCompletedGroups}
                  onRegisterGroup={(name, members) => {
                    const nextId = groups.length > 0 ? Math.max(...groups.map(g => g.game_id)) + 1 : 1001;
                    const newGroup = { id: 'grp_' + Date.now(), game_id: nextId, group_name: name, status: 'Registered', members: members.map(m => ({ id: 'm_' + Math.random(), member_name: m })) };
                    saveToStore([newGroup, ...groups], sessions, settings);
                    showToast(`Team "${name}" registered successfully!`);
                  }}
                  onUpdateGroup={(id, name, members) => {
                    const updated = groups.map(g => g.id === id ? { ...g, group_name: name, members: members.map(m => ({ id: m.id || 'm_' + Math.random(), member_name: m.member_name })) } : g);
                    saveToStore(updated, sessions, settings);
                    showToast("Team updated successfully!");
                  }}
                  onDeleteGroup={(id) => {
                    const updated = groups.filter(g => g.id !== id);
                    const newSess = { ...sessions }; delete newSess[id];
                    saveToStore(updated, newSess, settings);
                    showToast("Team removed.", "error");
                  }}
                  onStartGame={(id) => { setActiveGameId(id); setActiveTab('gamezone'); }}
                  onOpenDeductModal={(id) => { setDeductTargetId(id); setShowDeductModal(true); }}
                />
              )}

              {activeTab === 'gamezone' && (
                <GameZoneSection 
                  groups={groups}
                  sessions={sessions}
                  settings={settings}
                  activeGameId={activeGameId}
                  setActiveGameId={setActiveGameId}
                  onSaveSession={(id, data) => {
                    const newSess = { ...sessions, [id]: data };
                    const updatedGroups = groups.map(g => g.id === id ? { ...g, status: data.status } : g);
                    saveToStore(updatedGroups, newSess, settings);
                  }}
                  onOpenDeductModal={(id) => { setDeductTargetId(id); setShowDeductModal(true); }}
                  onAddDeduction={handleAddDeduction}
                  onFinishAndNavigate={() => setActiveTab('leaderboard')}
                  showToast={showToast}
                />
              )}

              {activeTab === 'leaderboard' && (
                <LeaderboardSection 
                  rankedCompletedGroups={rankedCompletedGroups} 
                  settings={settings}
                  onOpenDeductModal={(id) => { setDeductTargetId(id); setShowDeductModal(true); }}
                />
              )}

              {activeTab === 'settings' && (
                <SettingsSection 
                  settings={settings} 
                  onSaveSettings={(newSet) => {
                    saveToStore(groups, sessions, newSet);
                    showToast("Settings updated successfully!");
                  }} 
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    // GameZone Section with Overall Stopwatch + 3 Era Lap Timers
    function GameZoneSection({ groups, sessions, settings, activeGameId, setActiveGameId, onSaveSession, onOpenDeductModal, onAddDeduction, onFinishAndNavigate, showToast }) {
      const selectedGroup = groups.find(g => g.id === activeGameId) || groups[0];
      const session = selectedGroup ? (sessions[selectedGroup.id] || {
        score1: 0,
        score2: 0,
        score3: 0,
        reward_type: null,
        actual_duration: 0,
        running: false,
        status: 'Registered',
        current_era: 1,
        era1_duration: 0,
        era2_duration: 0,
        era3_duration: 0,
        deductions: []
      }) : null;

      const [score1, setScore1] = useState(session?.score1 || 0);
      const [score2, setScore2] = useState(session?.score2 || 0);
      const [score3, setScore3] = useState(session?.score3 || 0);
      const [rewardType, setRewardType] = useState(session?.reward_type || null);

      // Timers state
      const [overallElapsed, setOverallElapsed] = useState(0);
      const [era1Elapsed, setEra1Elapsed] = useState(0);
      const [era2Elapsed, setEra2Elapsed] = useState(0);
      const [era3Elapsed, setEra3Elapsed] = useState(0);

      // Overtime alert dismissed tracker per era
      const [alertDismissedEra, setAlertDismissedEra] = useState({});

      useEffect(() => {
        if (session) {
          setScore1(session.score1 || 0);
          setScore2(session.score2 || 0);
          setScore3(session.score3 || 0);
          setRewardType(session.reward_type || null);
        }
      }, [activeGameId, sessions]);

      // Ticking interval for accurate live calculation
      useEffect(() => {
        const updateClocks = () => {
          if (!session) return;
          const now = Date.now();
          const running = session.running && !session.paused;

          // 1. Overall Timer
          if (running && session.started_at) {
            const base = session.elapsed_before_pause || 0;
            setOverallElapsed(base + Math.max(0, Math.floor((now - session.started_at) / 1000)));
          } else {
            setOverallElapsed(session.actual_duration || session.elapsed_before_pause || 0);
          }

          // 2. Era 1
          if (session.era1_duration) {
            setEra1Elapsed(session.era1_duration);
          } else if (session.current_era === 1 && running && session.era1_started_at) {
            const base = session.era1_elapsed_before_pause || 0;
            setEra1Elapsed(base + Math.max(0, Math.floor((now - session.era1_started_at) / 1000)));
          } else {
            setEra1Elapsed(session.era1_elapsed_before_pause || 0);
          }

          // 3. Era 2
          if (session.era2_duration) {
            setEra2Elapsed(session.era2_duration);
          } else if (session.current_era === 2 && running && session.era2_started_at) {
            const base = session.era2_elapsed_before_pause || 0;
            setEra2Elapsed(base + Math.max(0, Math.floor((now - session.era2_started_at) / 1000)));
          } else {
            setEra2Elapsed(session.era2_elapsed_before_pause || 0);
          }

          // 4. Era 3
          if (session.era3_duration) {
            setEra3Elapsed(session.era3_duration);
          } else if (session.current_era === 3 && running && session.era3_started_at) {
            const base = session.era3_elapsed_before_pause || 0;
            setEra3Elapsed(base + Math.max(0, Math.floor((now - session.era3_started_at) / 1000)));
          } else {
            setEra3Elapsed(session.era3_elapsed_before_pause || 0);
          }
        };

        updateClocks();
        const iv = setInterval(updateClocks, 250);
        return () => clearInterval(iv);
      }, [session]);

      if (!selectedGroup) {
        return <div className="flex-1 p-8 text-center text-slate-500">No teams available. Please register a team first.</div>;
      }

      const results = computeTeamResults(selectedGroup, session, settings);
      const currentEra = session?.current_era || 1;
      const isRunning = session?.running && !session?.paused;
      const isPaused = session?.running && session?.paused;

      // Check for Era Overrun
      const currentEraLimit = currentEra === 1 ? settings.era1_limit : currentEra === 2 ? settings.era2_limit : settings.era3_limit;
      const currentEraElapsed = currentEra === 1 ? era1Elapsed : currentEra === 2 ? era2Elapsed : era3Elapsed;
      const isCurrentEraOvertime = session?.running && currentEraElapsed > currentEraLimit;
      const overtimeSeconds = isCurrentEraOvertime ? (currentEraElapsed - currentEraLimit) : 0;

      // Save Mini Game Scores
      const handleSaveScores = () => {
        onSaveSession(selectedGroup.id, {
          ...session,
          score1: Number(score1),
          score2: Number(score2),
          score3: Number(score3),
          scores_saved: true,
          status: session.status === 'Completed' ? 'Completed' : 'In Progress'
        });
        showToast("Mini-games scores saved successfully!");
      };

      // Select Reward
      const handleReward = (type) => {
        const reqCost = type === 'Extra Time' ? Number(settings.extratime_cost) : type === 'Hint' ? Number(settings.hint_cost) : 0;
        if (results.earned < reqCost) {
          alert(`Insufficient points for this reward (${results.earned} earned vs ${reqCost} required).`);
          return;
        }
        setRewardType(type);
        onSaveSession(selectedGroup.id, {
          ...session,
          reward_type: type,
          reward_cost_snapshot: reqCost
        });
        showToast(`Reward applied: ${type}`);
      };

      // Stopwatch Actions: Start
      const handleStartStopwatch = () => {
        if (!session?.scores_saved) {
          if (!confirm("Mini-games scores have not been saved yet. Do you want to proceed and start the stopwatch anyway?")) return;
        }
        const now = Date.now();
        onSaveSession(selectedGroup.id, {
          ...session,
          running: true,
          paused: false,
          started_at: now,
          current_era: 1,
          era1_started_at: now,
          status: 'In Progress'
        });
        showToast("Overall Stopwatch & Era 1 started!");
      };

      // Lap 1: Complete Era 1 -> Start Era 2
      const handleLapEra1 = () => {
        const now = Date.now();
        const finalEra1 = era1Elapsed;

          current_era: 2,
          era1_duration: finalEra1,

          running: false,
          paused: false,

                      <th className="p-4 text-center">Era 3</th>
                      <th className="p-4 text-center">Total Time</th>
                      <th className="p-4 text-center">Adjusted Time</th>
                      <th className="p-4 text-right">Net Points</th>
                      <th className="p-4 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-sm">
                    {filtered.map(g => (
                      <tr key={g.id} className={`hover:bg-slate-50/70 transition-colors ${g.officialRank <= 3 ? 'bg-indigo-50/20' : ''}`}>
                        <td className="p-4 text-center">
                          <span className={`inline-flex items-center justify-center w-8 h-8 rounded-full text-xs font-black shadow-sm ${
                            g.officialRank === 1 ? 'bg-amber-500 text-white ring-2 ring-amber-300' :
                            g.officialRank === 2 ? 'bg-slate-400 text-white' :
                            g.officialRank === 3 ? 'bg-amber-700 text-white' : 'bg-slate-100 text-slate-700'
                          }`}>
                            #{g.officialRank}
                          </span>
                        </td>
                        <td className="p-4 font-black text-indigo-600 font-mono">#{g.game_id}</td>
                        <td className="p-4">
                          <div className="font-extrabold text-slate-900">{g.group_name}</div>
                          <div className="text-xs text-slate-400 max-w-xs truncate">{g.members.map(m => m.member_name).join(', ')}</div>
                        </td>
                        <td className="p-4 text-center font-mono text-xs">{formatTime(g.res.era1Time)}</td>
                        <td className="p-4 text-center font-mono text-xs">{formatTime(g.res.era2Time)}</td>
                        <td className="p-4 text-center font-mono text-xs">{formatTime(g.res.era3Time)}</td>
                        <td className="p-4 text-center font-mono text-xs text-slate-600">{formatTime(g.res.actualDuration)}</td>
                        <td className="p-4 text-center font-mono text-sm font-black text-emerald-600">
                          {formatTime(g.res.adjustedDuration)}
                          {g.res.bonus > 0 && <span className="text-[10px] text-amber-600 block">(-{g.res.bonus}s bonus)</span>}
                        </td>
                        <td className="p-4 text-right">
                          <div className="font-black text-slate-900 text-base">{g.res.netPts} pts</div>
                          <div className="text-[10px] text-slate-400">
                            {g.res.earned} earned {g.res.totalDeductions > 0 && <span className="text-rose-500">(-{g.res.totalDeductions} pen)</span>}
                          </div>
                        </td>
                        <td className="p-4 text-right">
                          <button
                            onClick={() => onOpenDeductModal(g.id)}
                            className="px-2.5 py-1 text-rose-600 hover:bg-rose-50 rounded-lg text-xs font-bold"
                          >
                            Penalty
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Settings Section (Mini Games + 3 Eras Time Limits & Penalties)

                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Era 2 Name</label>
                  <input type="text" value={form.era2_name} onChange={(e) => setForm({ ...form, era2_name: e.target.value })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold" required />

                </div>
                <div>

            {/* Mini Games Setup */}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
