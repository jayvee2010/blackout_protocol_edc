<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDC Admin Panel - College Tech Event Administration</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Default configuration rules
    const DEFAULT_SETTINGS = {
      mg1_name: "Code Sprint",
      mg1_max: 50,
      mg2_name: "Debugging Battle",
      mg2_max: 50,
      mg3_name: "UI/UX Quiz",
      mg3_max: 50,
      extratime_cost: 100,
      hint_cost: 50,
      extratime_bonus: 60
    };

    // React-owned inline SVG icons (Lucide paths). Unlike <i data-lucide>, these are never
    // swapped out by an external script, so React can safely add/remove them.
    const Icon = ({ size = 16, className = "", children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
           stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
           className={`shrink-0 ${className}`} aria-hidden="true">
        {children}
      </svg>
    );

    const LayoutDashboardIcon = () => (
      <Icon><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Icon>
    );
    const Gamepad2Icon = () => (
      <Icon><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></Icon>
    );
    const TrophyIcon = ({ classNames = "" }) => (
      <Icon className={classNames.replace(/\bw-\S+|\bh-\S+/g, '').trim()}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></Icon>
    );
    const SettingsIcon = () => (
      <Icon><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>
    );
    const UsersIcon = () => (
      <Icon><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>
    );
    const PlusIcon = () => (
      <Icon size={14}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>
    );
    const Trash2Icon = () => (
      <Icon><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>
    );
    const Edit3Icon = () => (
      <Icon><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></Icon>
    );
    const PlayIcon = () => (
      <Icon size={18}><polygon points="6 3 20 12 6 21 6 3"/></Icon>
    );
    const SquareIcon = () => (
      <Icon size={18}><rect width="18" height="18" x="3" y="3" rx="2"/></Icon>
    );
    const CheckCircle2Icon = () => (
      <Icon size={18}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>
    );
    const AlertCircleIcon = () => (
      <Icon size={18}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></Icon>
    );
    const SearchIcon = () => (
      <Icon><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>
    );
    const AwardIcon = () => (
      <Icon size={18}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></Icon>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [groups, setGroups] = useState([]);
      const [sessions, setSessions] = useState({});
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [activeGameId, setActiveGameId] = useState(null);
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Load data from persistent local storage on boot
      useEffect(() => {
        try {
          const localGroups = localStorage.getItem('edc_event_groups');
          const localSess = localStorage.getItem('edc_event_sessions');
          const localSets = localStorage.getItem('edc_event_settings');
          if (localGroups) setGroups(JSON.parse(localGroups));
          if (localSess) setSessions(JSON.parse(localSess));
          if (localSets) setSettings(JSON.parse(localSets));
        } catch (err) {
          console.warn("Storage load error:", err);
        }
      }, []);

      const saveToStore = (newGroups, newSessions, newSettings) => {
        if (newGroups !== undefined) {
          setGroups(newGroups);
          localStorage.setItem('edc_event_groups', JSON.stringify(newGroups));
        }
        if (newSessions !== undefined) {
          setSessions(newSessions);
          localStorage.setItem('edc_event_sessions', JSON.stringify(newSessions));
        }
        if (newSettings !== undefined) {
          setSettings(newSettings);
          localStorage.setItem('edc_event_settings', JSON.stringify(newSettings));
        }
      };

      // Calculate ranks: Lowest adjusted time first, then highest remaining points
      const completedGroups = groups.filter(g => sessions[g.id]?.status === 'Completed').map(g => {
        const sess = sessions[g.id];
        const actualTime = Number(sess.actual_duration) || 0;
        const bonus = sess.reward_type === 'Extra Time' ? Number(settings.extratime_bonus) : 0;
        const adjustedTime = Math.max(0, actualTime - bonus);
        const earnedPts = (Number(sess.score1) || 0) + (Number(sess.score2) || 0) + (Number(sess.score3) || 0);
        const cost = sess.reward_cost_snapshot !== undefined ? Number(sess.reward_cost_snapshot) : (sess.reward_type === 'Extra Time' ? Number(settings.extratime_cost) : sess.reward_type === 'Hint' ? Number(settings.hint_cost) : 0);
        const remainingPts = Math.max(0, earnedPts - cost);

        return { 
          ...g, 
          session: sess, 
          actualTime, 
          adjustedTime, 
          earnedPts, 
          remainingPts, 
          rewardType: sess.reward_type || 'None' 
        };
      });

      // Precise sorting calculation
      completedGroups.sort((a, b) => {
        if (a.adjustedTime !== b.adjustedTime) {
          return a.adjustedTime - b.adjustedTime;
        }
        return b.remainingPts - a.remainingPts;
      });

      let currentRank = 1;
      const rankedCompletedGroups = completedGroups.map((group, index, arr) => {
        if (index > 0 && (group.adjustedTime !== arr[index - 1].adjustedTime || group.remainingPts !== arr[index - 1].remainingPts)) {
          currentRank = index + 1;
        }
        return { ...group, officialRank: currentRank };
      });

      const totalMembersCount = groups.reduce((acc, g) => acc + (g.members ? g.members.length : 0), 0);

      return (
        <div className="flex h-screen bg-[#F8FAFC] text-[#0F172A] font-sans overflow-hidden antialiased">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border text-sm font-semibold transition-all ${
              toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'
            }`}>
              {toast.type === 'error' ? <AlertCircleIcon /> : <CheckCircle2Icon />}
              <span>{toast.message}</span>
            </div>
          )}

          {/* Sidebar Navigation */}
          <aside className="w-64 bg-white border-r border-slate-200/80 flex flex-col justify-between select-none shadow-sm">
        <div>
          <div className="p-6 border-b border-slate-100">
            <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400">ELECTRONIC DESIGN CLUB</div>
            <div className="text-lg font-extrabold text-slate-900 mt-0.5 tracking-tight">
            Administration Panel
            </div>
          </div>

          <nav className="p-4 space-y-1">
                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <LayoutDashboardIcon />
                  <span>Dashboard</span>
                </button>
                <button onClick={() => { if (!activeGameId && groups.length > 0) setActiveGameId(groups[0].id); setActiveTab('gamezone'); }} className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all ${activeTab === 'gamezone' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <Gamepad2Icon />
                  <span>GameZone</span>
                </button>
                <button onClick={() => setActiveTab('leaderboard')} className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all ${activeTab === 'leaderboard' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <TrophyIcon />
                  <span>Leaderboard</span>
                </button>
                <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition-all ${activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-slate-600 hover:bg-slate-100'}`}>
                  <SettingsIcon />
                  <span>Settings</span>
                </button>
              </nav>
            </div>

            <div className="p-4 border-t border-slate-100 bg-slate-50/50 flex flex-col gap-2">
              <div className="flex items-center justify-between text-xs font-medium text-slate-500">
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"/> Local Storage Active</span>
              </div>
              <button 
                onClick={() => {
                  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ groups, sessions, settings }, null, 2));
                  const downloadAnchor = document.createElement('a');
                  downloadAnchor.setAttribute("href", dataStr);
                  downloadAnchor.setAttribute("download", `edc_event_backup_${Date.now()}.json`);
                  document.body.appendChild(downloadAnchor);
                  downloadAnchor.click();
                  downloadAnchor.remove();
                  showToast("Backup exported successfully!");
                }}
                className="w-full mt-1 py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition-colors text-center"
              >
                Export JSON Backup
              </button>
            </div>
          </aside>

          {/* Main Area */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            {activeTab === 'dashboard' && (
              <DashboardSection 
                groups={groups} 
                totalMembersCount={totalMembersCount}
                rankedCompletedGroups={rankedCompletedGroups}
                onRegisterGroup={(name, members) => {
                  const nextId = groups.length > 0 ? Math.max(...groups.map(g => g.game_id)) + 1 : 1001;
                  const newGroup = { id: 'grp_' + Date.now(), game_id: nextId, group_name: name, status: 'Registered', members: members.map(m => ({ id: 'm_' + Math.random(), member_name: m })) };
                  saveToStore([newGroup, ...groups], sessions, settings);
                  showToast(`Team "${name}" registered successfully!`);
                }}
                onUpdateGroup={(id, name, members) => {
                  const updated = groups.map(g => g.id === id ? { ...g, group_name: name, members: members.map(m => ({ id: m.id || 'm_' + Math.random(), member_name: m.member_name })) } : g);
                  saveToStore(updated, sessions, settings);
                  showToast("Team updated successfully!");
                }}
                onDeleteGroup={(id) => {
                  const updated = groups.filter(g => g.id !== id);
                  const newSess = { ...sessions }; delete newSess[id];
                  saveToStore(updated, newSess, settings);
                  showToast("Team removed.", "error");
                }}
                onStartGame={(id) => { setActiveGameId(id); setActiveTab('gamezone'); }}
              />
            )}

            {activeTab === 'gamezone' && (
              <GameZoneSection 
                groups={groups}
                sessions={sessions}
                settings={settings}
                activeGameId={activeGameId}
                setActiveGameId={setActiveGameId}
                onSaveSession={(id, data) => {
                  const newSess = { ...sessions, [id]: data };
                  const updatedGroups = groups.map(g => g.id === id ? { ...g, status: data.status } : g);
                  saveToStore(updatedGroups, newSess, settings);
                  showToast("Progress saved!");
                }}
                onFinishAndNavigate={() => setActiveTab('leaderboard')}
              />
            )}

            {activeTab === 'leaderboard' && (
              <LeaderboardSection rankedCompletedGroups={rankedCompletedGroups} />
            )}

            {activeTab === 'settings' && (
              <SettingsSection 
                settings={settings} 
                onSaveSettings={(newSet) => {
                  saveToStore(groups, sessions, newSet);
                  showToast("Settings updated successfully!");
                }} 
              />
            )}
          </main>
        </div>
      );
    }

    function DashboardSection({ groups, totalMembersCount, rankedCompletedGroups, onRegisterGroup, onUpdateGroup, onDeleteGroup, onStartGame }) {
      const [groupName, setGroupName] = useState('');
      const [members, setMembers] = useState(['', '', '']);
      const [editingId, setEditingId] = useState(null);
      const [search, setSearch] = useState('');

      const handleAddMember = () => setMembers([...members, '']);
      const handleMemberChange = (i, val) => { const updated = [...members]; updated[i] = val; setMembers(updated); };
      const handleRemoveMember = (i) => { if (members.length <= 3) { alert("Minimum 3 members required."); return; } setMembers(members.filter((_, idx) => idx !== i)); };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!groupName.trim()) return;
        const validMembers = members.map(m => m.trim()).filter(Boolean);
        if (validMembers.length < 3) { alert("Please provide at least 3 valid members."); return; }
        if (editingId) {
          onUpdateGroup(editingId, groupName, validMembers);
          setEditingId(null);
        } else {
          onRegisterGroup(groupName, validMembers);
        }
        setGroupName(''); setMembers(['', '', '']);
      };

      const filtered = groups.filter(g => g.group_name.toLowerCase().includes(search.toLowerCase()) || g.game_id.toString().includes(search));

      return (
        <div className="flex-1 p-8 space-y-8 max-w-7xl mx-auto w-full">
          <div>
            <h1 className="text-2xl font-black text-slate-900 tracking-tight">Dashboard Overview</h1>
            <p className="text-sm text-slate-500 mt-1">Manage team registrations and track live event standings.</p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Teams Registered</div>
              <div className="text-3xl font-black text-slate-900 mt-2">{groups.length}</div>
            </div>
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Participants Enrolled</div>
              <div className="text-3xl font-black text-indigo-600 mt-2">{totalMembersCount}</div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                <TrophyIcon classNames="w-4 h-4 text-amber-500" /> Top Leaders
              </h3>
              {rankedCompletedGroups.length === 0 ? (
                <div className="text-center py-12 text-sm text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                  No completed results yet.
                </div>
              ) : (
                <div className="space-y-3">
                  {rankedCompletedGroups.slice(0, 3).map((g) => (
                    <div key={g.id} className="flex items-center justify-between p-3.5 rounded-xl bg-slate-50 border border-slate-100">
                      <div className="flex items-center gap-3">
                        <span className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${g.officialRank === 1 ? 'bg-amber-500 text-white' : g.officialRank === 2 ? 'bg-slate-400 text-white' : 'bg-amber-700 text-white'}`}>
                          #{g.officialRank}
                        </span>
                        <div>
                          <span className="font-bold text-sm text-slate-900 block">{g.group_name}</span>
                          <span className="text-xs font-mono text-emerald-600 font-semibold">{Math.floor(g.adjustedTime / 60)}m {g.adjustedTime % 60}s ({g.remainingPts} Pts)</span>
                        </div>
                      </div>
                      <span className="text-xs font-bold text-indigo-600">#{g.game_id}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <h3 className="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                <UsersIcon /> {editingId ? 'Edit Team Details' : 'Register New Team'}
              </h3>
              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Team Name *</label>
                  <input type="text" placeholder="e.g. Challengers" value={groupName} onChange={(e) => setGroupName(e.target.value)} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 bg-slate-50" required />
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="block text-xs font-bold uppercase text-slate-600">Team Members (Min 3) *</label>
                    <button type="button" onClick={handleAddMember} className="text-xs font-bold text-indigo-600 hover:underline flex items-center gap-1">
                      <PlusIcon /> Add Member
                    </button>
                  </div>
                  <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                    {members.map((m, idx) => (
                      <div key={idx} className="flex gap-2">
                        <input type="text" placeholder={`Member ${idx + 1} Name`} value={m} onChange={(e) => handleMemberChange(idx, e.target.value)} className="flex-1 px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 bg-slate-50" required />
                        {members.length > 3 && (
                          <button type="button" onClick={() => handleRemoveMember(idx)} className="p-2 text-red-500 hover:bg-red-50 rounded-xl">
                            <Trash2Icon />
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex items-center gap-3 pt-2">
                  <button type="submit" className="px-6 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-100 transition-all">
                    {editingId ? 'Update Team' : 'Register Team'}
                  </button>
                  {editingId && (
                    <button type="button" onClick={() => { setEditingId(null); setGroupName(''); setMembers(['', '', '']); }} className="px-5 py-2.5 bg-slate-100 text-slate-600 text-sm font-bold rounded-xl hover:bg-slate-200">
                      Cancel
                    </button>
                  )}
                </div>
              </form>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-6 border-b border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <h3 className="text-base font-bold text-slate-900">Registered Teams</h3>
              <div className="relative">
                <div className="absolute left-3 top-3 text-slate-400"><SearchIcon /></div>
                <input type="text" placeholder="Search team or ID..." value={search} onChange={(e) => setSearch(e.target.value)} className="pl-9 pr-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 w-64 bg-slate-50" />
              </div>
            </div>

            {filtered.length === 0 ? (
              <div className="text-center py-12 text-slate-400 text-sm">No teams found.</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-400 uppercase">
                      <th className="p-4">Game ID</th>
                      <th className="p-4">Team Name</th>
                      <th className="p-4">Members</th>
                      <th className="p-4">Status</th>
                      <th className="p-4 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-sm">
                    {filtered.map(g => (
                      <tr key={g.id} className="hover:bg-slate-50/50 transition-colors">
                        <td className="p-4 font-black text-indigo-600">#{g.game_id}</td>
                        <td className="p-4 font-bold text-slate-900">{g.group_name}</td>
                        <td className="p-4 text-slate-500 text-xs max-w-xs truncate">{g.members.map(m => m.member_name).join(', ')}</td>
                        <td className="p-4">
                          <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold ${g.status === 'Completed' ? 'bg-emerald-50 text-emerald-700' : g.status === 'In Progress' ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-600'}`}>
                            {g.status || 'Registered'}
                          </span>
                        </td>
                        <td className="p-4 text-right space-x-2">
                          <button onClick={() => onStartGame(g.id)} className="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 text-xs font-bold">Manage</button>
                          <button onClick={() => { setEditingId(g.id); setGroupName(g.group_name); setMembers(g.members.map(m => m.member_name)); }} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg"><Edit3Icon /></button>
                          <button onClick={() => { if (confirm(`Delete team "${g.group_name}"?`)) onDeleteGroup(g.id); }} className="p-1.5 text-red-500 hover:bg-red-50 rounded-lg"><Trash2Icon /></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    function GameZoneSection({ groups, sessions, settings, activeGameId, setActiveGameId, onSaveSession, onFinishAndNavigate }) {
      const selectedGroup = groups.find(g => g.id === activeGameId) || groups[0];
      const session = selectedGroup ? (sessions[selectedGroup.id] || { score1: 0, score2: 0, score3: 0, reward_type: null, actual_duration: 0, running: false, status: 'Registered' }) : null;

      const [score1, setScore1] = useState(session?.score1 || 0);
      const [score2, setScore2] = useState(session?.score2 || 0);
      const [score3, setScore3] = useState(session?.score3 || 0);
      const [rewardType, setRewardType] = useState(session?.reward_type || null);
      const [elapsed, setElapsed] = useState(session?.actual_duration || 0);
      const [isRunning, setIsRunning] = useState(session?.running || false);
      const timerRef = useRef(null);

      useEffect(() => {
        if (session) {
          setScore1(session.score1 || 0);
          setScore2(session.score2 || 0);
          setScore3(session.score3 || 0);
          setRewardType(session.reward_type || null);
          setElapsed(session.actual_duration || 0);
          setIsRunning(session.running || false);
        }
      }, [activeGameId, sessions]);

      useEffect(() => {
        if (isRunning) {
          const start = Date.now() - (elapsed * 1000);
          timerRef.current = setInterval(() => setElapsed(Math.floor((Date.now() - start) / 1000)), 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isRunning]);

      if (!selectedGroup) {
        return <div className="flex-1 p-8 text-center text-slate-500">No teams available. Please register a team first.</div>;
      }

      const earnedPts = (Number(score1) || 0) + (Number(score2) || 0) + (Number(score3) || 0);
      const cost = rewardType === 'Extra Time' ? Number(settings.extratime_cost) : rewardType === 'Hint' ? Number(settings.hint_cost) : 0;
      const balance = Math.max(0, earnedPts - cost);

      const handleSaveScores = () => {
        onSaveSession(selectedGroup.id, { ...session, score1: Number(score1), score2: Number(score2), score3: Number(score3), scores_saved: true, status: 'In Progress' });
      };

      const handleReward = (type) => {
        const reqCost = type === 'Extra Time' ? Number(settings.extratime_cost) : type === 'Hint' ? Number(settings.hint_cost) : 0;
        if (earnedPts < reqCost) { alert("Insufficient points for this reward."); return; }
        setRewardType(type);
        onSaveSession(selectedGroup.id, { ...session, reward_type: type, reward_cost_snapshot: reqCost });
      };

      const handleTimerStart = () => {
        if (!session?.scores_saved) { alert("Please save scores first."); return; }
        if (!rewardType) { alert("Please select a reward option."); return; }
        setIsRunning(true);
        onSaveSession(selectedGroup.id, { ...session, running: true, status: 'In Progress' });
      };

      const handleTimerStop = () => {
        setIsRunning(false);
        onSaveSession(selectedGroup.id, { ...session, running: false, actual_duration: elapsed });
      };

      const handleFinalize = () => {
        if (isRunning || elapsed === 0) { alert("Stop the timer before finalizing."); return; }
        onSaveSession(selectedGroup.id, { ...session, running: false, actual_duration: elapsed, status: 'Completed' });
        onFinishAndNavigate();
      };

      const formatTime = (s) => `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;

      return (
        <div className="flex-1 p-8 space-y-8 max-w-7xl mx-auto w-full">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-black text-slate-900 tracking-tight">GameZone Control</h1>
              <p className="text-sm text-slate-500 mt-1">Record mini-games scoring, apply rewards, and manage live stopwatches.</p>
            </div>
            <div className="flex items-center gap-3 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-400 uppercase pl-2">Active Team:</span>
              <select value={activeGameId || ''} onChange={(e) => setActiveGameId(e.target.value)} className="px-3 py-1.5 text-sm font-bold border border-slate-200 rounded-xl bg-slate-50 text-slate-900 focus:outline-none">
                {groups.map(g => <option key={g.id} value={g.id}>#{g.game_id} - {g.group_name}</option>)}
              </select>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <span className="px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-600">Game ID #{selectedGroup.game_id}</span>
              <h2 className="text-xl font-black text-slate-900 mt-2">{selectedGroup.group_name}</h2>
              <p className="text-xs text-slate-500 mt-1">Members: {selectedGroup.members.map(m => m.member_name).join(', ')}</p>
            </div>
            <div className="flex items-center gap-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
              <div>
                <div className="text-xs font-bold text-slate-400 uppercase">Earned Pts</div>
                <div className="text-lg font-black text-slate-900">{earnedPts}</div>
              </div>
              <div className="border-l border-slate-200 pl-6">
                <div className="text-xs font-bold text-slate-400 uppercase">Reward Balance</div>
                <div className="text-lg font-black text-indigo-600">{balance}</div>
              </div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <h3 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2">
              <AwardIcon /> Mini Games Scoring
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                <div className="flex justify-between items-center text-xs font-bold text-slate-700">
                  <span>{settings.mg1_name}</span>
                  <span className="text-slate-400">Max: {settings.mg1_max}</span>
                </div>
                <input type="number" min="0" max={settings.mg1_max} value={score1} onChange={(e) => setScore1(e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl bg-white font-bold focus:outline-none focus:border-indigo-600"/>
              </div>
              <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                <div className="flex justify-between items-center text-xs font-bold text-slate-700">
                  <span>{settings.mg2_name}</span>
                  <span className="text-slate-400">Max: {settings.mg2_max}</span>
                </div>
                <input type="number" min="0" max={settings.mg2_max} value={score2} onChange={(e) => setScore2(e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl bg-white font-bold focus:outline-none focus:border-indigo-600"/>
              </div>
              <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                <div className="flex justify-between items-center text-xs font-bold text-slate-700">
                  <span>{settings.mg3_name}</span>
                  <span className="text-slate-400">Max: {settings.mg3_max}</span>
                </div>
                <input type="number" min="0" max={settings.mg3_max} value={score3} onChange={(e) => setScore3(e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl bg-white font-bold focus:outline-none focus:border-indigo-600"/>
              </div>
            </div>
            <div className="flex justify-end">
              <button onClick={handleSaveScores} className="px-6 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-100 transition-all">Save Scores</button>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <h3 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-3">Reward Selection</h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
              <div onClick={() => handleReward('Extra Time')} className={`p-5 rounded-2xl border cursor-pointer transition-all ${rewardType === 'Extra Time' ? 'border-indigo-600 bg-indigo-50/40 shadow-sm' : 'border-slate-200 bg-slate-50 hover:border-slate-300'}`}>
                <div className="flex justify-between items-center mb-1 font-bold text-sm text-slate-900">
                  <span>Extra Time (+{settings.extratime_bonus}s)</span>
                  <span className="text-amber-600">{settings.extratime_cost} Pts</span>
                </div>
                <p className="text-xs text-slate-500">Deduct points to gain a time bonus.</p>
              </div>
              <div onClick={() => handleReward('Hint')} className={`p-5 rounded-2xl border cursor-pointer transition-all ${rewardType === 'Hint' ? 'border-indigo-600 bg-indigo-50/40 shadow-sm' : 'border-slate-200 bg-slate-50 hover:border-slate-300'}`}>
                <div className="flex justify-between items-center mb-1 font-bold text-sm text-slate-900">
                  <span>Hint</span>
                  <span className="text-amber-600">{settings.hint_cost} Pts</span>
                </div>
                <p className="text-xs text-slate-500">Receive expert assistance.</p>
              </div>
              <div onClick={() => handleReward('None')} className={`p-5 rounded-2xl border cursor-pointer transition-all ${rewardType === 'None' ? 'border-indigo-600 bg-indigo-50/40 shadow-sm' : 'border-slate-200 bg-slate-50 hover:border-slate-300'}`}>
                <div className="flex justify-between items-center mb-1 font-bold text-sm text-slate-900">
                  <span>None</span>
                  <span className="text-emerald-600">0 Pts</span>
                </div>
                <p className="text-xs text-slate-500">Preserve all points.</p>
              </div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6 text-center">
            <h3 className="text-base font-bold text-slate-900 text-left border-b border-slate-100 pb-3">Blackout Games Stopwatch</h3>
            <div className="py-6">
              <div className="text-6xl font-black font-mono text-slate-900 tracking-wider">{formatTime(elapsed)}</div>
              <div className="text-xs font-bold text-slate-400 mt-2">{isRunning ? 'Timer Running...' : 'Timer Paused'}</div>
            </div>
            <div className="flex items-center justify-center gap-4">
              {!isRunning ? (
                <button onClick={handleTimerStart} className="px-6 py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 flex items-center gap-2 shadow-md shadow-emerald-100">
                  <PlayIcon /> Start Timer
                </button>
              ) : (
                <button onClick={handleTimerStop} className="px-6 py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 flex items-center gap-2 shadow-md shadow-red-100">
                  <SquareIcon /> Stop Timer
                </button>
              )}
              <button onClick={handleFinalize} disabled={isRunning || elapsed === 0} className={`px-6 py-3 font-bold rounded-xl flex items-center gap-2 shadow-md ${isRunning || elapsed === 0 ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-indigo-100'}`}>
                <CheckCircle2Icon /> Finalize Session
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LeaderboardSection({ rankedCompletedGroups }) {
      const [search, setSearch] = useState('');
      const filtered = rankedCompletedGroups.filter(g => g.group_name.toLowerCase().includes(search.toLowerCase()) || g.game_id.toString().includes(search));

      return (
        <div className="flex-1 p-8 space-y-8 max-w-7xl mx-auto w-full">
          <div>
            <h1 className="text-2xl font-black text-slate-900 tracking-tight">Official Leaderboard</h1>
            <p className="text-sm text-slate-500 mt-1">Ranked standings based on lowest adjusted completion times and highest remaining points.</p>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-6 border-b border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <h3 className="text-base font-bold text-slate-900">Standings</h3>
              <div className="relative">
                <div className="absolute left-3 top-3 text-slate-400"><SearchIcon /></div>
                <input type="text" placeholder="Search standings..." value={search} onChange={(e) => setSearch(e.target.value)} className="pl-9 pr-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 w-64 bg-slate-50" />
              </div>
            </div>

            {filtered.length === 0 ? (
              <div className="text-center py-16 text-slate-400 text-sm">No completed team results on the leaderboard yet.</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-400 uppercase">
                      <th className="p-4">Rank</th>
                      <th className="p-4">Game ID</th>
                      <th className="p-4">Team Name</th>
                      <th className="p-4">Members</th>
                      <th className="p-4">Actual Time</th>
                      <th className="p-4">Adjusted Time</th>
                      <th className="p-4">Remaining Pts</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-sm">
                    {filtered.map(g => (
                      <tr key={g.id} className={`hover:bg-slate-50/50 transition-colors ${g.officialRank <= 3 ? 'bg-indigo-50/30' : ''}`}>
                        <td className="p-4 font-bold">
                          <span className={`inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-bold shadow-sm ${g.officialRank === 1 ? 'bg-amber-500 text-white' : g.officialRank === 2 ? 'bg-slate-400 text-white' : g.officialRank === 3 ? 'bg-amber-700 text-white' : 'bg-slate-100 text-slate-700'}`}>
                            {g.officialRank}
                          </span>
                        </td>
                        <td className="p-4 font-bold text-indigo-600">#{g.game_id}</td>
                        <td className="p-4 font-bold text-slate-900">{g.group_name}</td>
                        <td className="p-4 text-slate-500 text-xs max-w-xs truncate">{g.members.map(m => m.member_name).join(', ')}</td>
                        <td className="p-4 font-mono text-xs">{Math.floor(g.actualTime / 60)}m {g.actualTime % 60}s</td>
                        <td className="p-4 font-mono text-xs font-bold text-emerald-600">{Math.floor(g.adjustedTime / 60)}m {g.adjustedTime % 60}s</td>
                        <td className="p-4 font-bold text-slate-900">{g.remainingPts} Pts <span className="text-xs font-normal text-slate-400">({g.rewardType})</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SettingsSection({ settings, onSaveSettings }) {
      const [form, setForm] = useState(settings);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSaveSettings(form);
      };

      return (
        <div className="flex-1 p-8 space-y-8 max-w-4xl mx-auto w-full">
          <div>
            <h1 className="text-2xl font-black text-slate-900 tracking-tight">Settings & Configuration</h1>
            <p className="text-sm text-slate-500 mt-1">Customize mini-game titles, maximum score weights, reward deduction costs, and time bonuses.</p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-6">
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-3">Mini Games Setup</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Mini Game 1 Name</label>
                  <input type="text" value={form.mg1_name} onChange={(e) => setForm({ ...form, mg1_name: e.target.value })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:border-indigo-600" required />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Max Points</label>
                  <input type="number" value={form.mg1_max} onChange={(e) => setForm({ ...form, mg1_max: Number(e.target.value) })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:border-indigo-600" required />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Mini Game 2 Name</label>
                  <input type="text" value={form.mg2_name} onChange={(e) => setForm({ ...form, mg2_name: e.target.value })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:border-indigo-600" required />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Max Points</label>
                  <input type="number" value={form.mg2_max} onChange={(e) => setForm({ ...form, mg2_max: Number(e.target.value) })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:border-indigo-600" required />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Mini Game 3 Name</label>
                  <input type="text" value={form.mg3_name} onChange={(e) => setForm({ ...form, mg3_name: e.target.value })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:border-indigo-600" required />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Max Points</label>
                  <input type="number" value={form.mg3_max} onChange={(e) => setForm({ ...form, mg3_max: Number(e.target.value) })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:border-indigo-600" required />
                </div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-3">Reward Costs & Bonus Rules</h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Extra Time Cost (Pts)</label>
                  <input type="number" value={form.extratime_cost} onChange={(e) => setForm({ ...form, extratime_cost: Number(e.target.value) })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:border-indigo-600" required />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Hint Cost (Pts)</label>
                  <input type="number" value={form.hint_cost} onChange={(e) => setForm({ ...form, hint_cost: Number(e.target.value) })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:border-indigo-600" required />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Time Bonus (Secs)</label>
                  <input type="number" value={form.extratime_bonus} onChange={(e) => setForm({ ...form, extratime_bonus: Number(e.target.value) })} className="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 font-semibold focus:outline-none focus:border-indigo-600" required />
                </div>
              </div>
            </div>

            <div className="flex justify-end gap-3">
              <button type="button" onClick={() => setForm(DEFAULT_SETTINGS)} className="px-5 py-2.5 bg-slate-100 text-slate-600 text-sm font-bold rounded-xl hover:bg-slate-200">Restore Defaults</button>
              <button type="submit" className="px-6 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-100 transition-all">Save Settings</button>
            </div>
          </form>
        </div>
      );
    }

    // Render the React app into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
